<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <!-- =================================================
         MOBILE RESPONSIVE
    ================================================== -->

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#071418"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >


    <!-- =================================================
         TITLE
    ================================================== -->

    <title>GHN Attendance</title>


    <!-- =================================================
         BOOTSTRAP
    ================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- =================================================
         BOOTSTRAP ICONS
    ================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >


    <!-- =================================================
         GHN STYLE
         V14 = chống cache
    ================================================== -->

    <link
        rel="stylesheet"
        href="style.css?v=14"
    >

</head>


<body>


    <!-- =================================================
         HEADER
    ================================================== -->

    <header class="container app-container">

        <div class="header-banner"></div>

    </header>



    <!-- =================================================
         MAIN
    ================================================== -->

    <main class="container app-container">

        <div class="row g-4">


            <!-- =================================================
                 CHECK IN
            ================================================== -->

            <div class="col-12 col-lg-6">

                <section class="glass-card">


                    <!-- =========================================
                         CHECK IN TITLE
                    ========================================== -->

                    <div class="section-title">

                        <i class="bi bi-box-arrow-in-right"></i>

                        <span>
                            CHECK IN
                        </span>

                    </div>


                    <!-- =========================================
                         DIVIDER
                    ========================================== -->

                    <div class="section-divider"></div>



                    <!-- =========================================
                         MÔ HÌNH
                    ========================================== -->

                    <div class="form-group">

                        <label for="moHinh">
                            Mô hình
                        </label>

                        <select
                            id="moHinh"
                            class="form-select"
                        >

                            <option value="">
                                Đang tải...
                            </option>

                        </select>

                    </div>



                    <!-- =========================================
                         BƯU CỤC
                    ========================================== -->

                    <div class="form-group">

                        <label for="kho">
                            Bưu cục
                        </label>

                        <select
                            id="kho"
                            class="form-select"
                        >

                            <option value="">
                                -- Chọn mô hình trước --
                            </option>

                        </select>

                    </div>



                    <!-- =========================================
                         CA LÀM VIỆC
                    ========================================== -->

                    <div class="form-group">

                        <label for="ca">
                            Ca làm việc
                        </label>

                        <select
                            id="ca"
                            class="form-select"
                        >

                            <option value="">
                                -- Chọn bưu cục trước --
                            </option>

                        </select>

                    </div>



                    <!-- =========================================
                         HỌ VÀ TÊN
                    ========================================== -->

                    <div class="form-group">

                        <label for="hoten">
                            Họ và tên
                        </label>

                        <input
                            id="hoten"
                            type="text"
                            class="form-control"
                            autocomplete="off"
                            placeholder="Nhập họ và tên"
                        >

                    </div>



                    <!-- =========================================
                         MÃ NHÂN VIÊN
                    ========================================== -->

                    <div class="form-group">

                        <label for="manv">
                            Mã nhân viên
                        </label>

                        <input
                            id="manv"
                            type="text"
                            class="form-control"
                            autocomplete="off"
                            inputmode="numeric"
                            placeholder="Nhập mã nhân viên"
                        >

                    </div>



                    <!-- =========================================
                         SỐ ĐIỆN THOẠI
                    ========================================== -->

                    <div class="form-group">

                        <label for="sdt">
                            Số điện thoại
                        </label>

                        <input
                            id="sdt"
                            type="tel"
                            class="form-control"
                            autocomplete="off"
                            inputmode="tel"
                            placeholder="Nhập số điện thoại"
                        >

                    </div>



                    <!-- =========================================
                         CHECK IN BUTTON
                    ========================================== -->

                    <button
                        id="checkInButton"
                        type="button"
                        class="btn btn-ghn"
                        onclick="checkIn()"
                    >

                        <i class="bi bi-check-circle"></i>

                        <span>
                            CHECK IN
                        </span>

                    </button>


                </section>

            </div>



            <!-- =================================================
                 CHECK OUT
            ================================================== -->

            <div class="col-12 col-lg-6">

                <section class="glass-card">


                    <!-- =========================================
                         CHECK OUT TITLE
                    ========================================== -->

                    <div class="section-title">

                        <i class="bi bi-box-arrow-right"></i>

                        <span>
                            CHECK OUT
                        </span>

                    </div>


                    <!-- =========================================
                         DIVIDER
                    ========================================== -->

                    <div class="section-divider"></div>



                    <!-- =========================================
                         MÃ NHÂN VIÊN
                    ========================================== -->

                    <div class="form-group">

                        <label for="checkoutManv">
                            Mã nhân viên
                        </label>

                        <input
                            id="checkoutManv"
                            type="text"
                            class="form-control"
                            autocomplete="off"
                            inputmode="numeric"
                            placeholder="Nhập mã nhân viên"
                        >

                    </div>



                    <!-- =========================================
                         HIDDEN ROW
                    ========================================== -->

                    <input
                        type="hidden"
                        id="checkoutRow"
                    >



                    <!-- =========================================
                         KIỂM TRA CHECK OUT
                    ========================================== -->

                    <button
                        id="checkInfoButton"
                        type="button"
                        class="btn btn-checkout"
                        onclick="kiemTraCheckOut()"
                    >

                        <i class="bi bi-search"></i>

                        <span>
                            KIỂM TRA
                        </span>

                    </button>



                    <!-- =========================================
                         CHECKOUT INFO
                    ========================================== -->

                    <div
                        id="checkoutInfo"
                        class="checkout-info"
                    >

                        <div class="empty-state">

                            <i class="bi bi-person-check"></i>

                            <h5>
                                THÔNG TIN CHECK IN
                            </h5>

                            <p>

                                Nhập mã nhân viên và nhấn

                                <b>
                                    KIỂM TRA
                                </b>

                                để xem thông tin.

                            </p>

                        </div>

                    </div>


                </section>

            </div>


        </div>

    </main>



    <!-- =================================================
         FOOTER
    ================================================== -->

    <footer class="container app-container">

        <div class="footer">

            GHN Attendance System

        </div>

    </footer>



    <!-- =================================================
         JAVASCRIPT
         V14 = chống cache
    ================================================== -->

    <script
        src="script.js?v=14"
    ></script>


</body>

</html>
